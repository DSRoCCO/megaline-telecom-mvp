[project]
name = "megaline-telecom-mvp"
version = "0.1.0"
description = "MVP de análisis de rentabilidad y modelado predictivo para Megaline Telecom"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.32.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"